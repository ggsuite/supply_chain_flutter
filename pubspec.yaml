name: supply_chain_flutter
description: Flutter widgets connecting the supply_chain ecosystem to the UI.
version: 1.2.0
repository: https://github.com/ggsuite/supply_chain_flutter

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  supply_chain: ^5.6.0

dev_dependencies:
  dna_ggsuite: ^0.2.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  gg_cache: ^1.2.0
  gg_golden: ^3.2.0
  gg_is_github: ^1.2.0
  helix: ^1.3.0

# Temporary: gg_golden depends on test ^1.31.2, which pulls test_api 0.7.13,
# while flutter_test from the Flutter SDK still pins test_api 0.7.12. Pinning
# test to 1.31.1 (the last release on test_api 0.7.12) lets both coexist so the
# DNA can be installed. Remove this block once Flutter ships test_api 0.7.13 —
# it is already on the master channel.
dependency_overrides:
  test: 1.31.1
